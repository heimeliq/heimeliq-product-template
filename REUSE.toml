version = 1

# REUSE-konforme Lizenzangaben fuer dieses Repository.
# Siehe https://reuse.software/spec/ fuer Details.
#
# Zwei Lizenz-Welten:
# - MIT: Template-Strukturdateien (Workflows, Schemas, README/LICENSE des Templates).
# - CERN-OHL-S-2.0: alles, was Inhalt des Moebels werden wird (Manifeste,
#   Doku-Markdown, Bilder, CAD-Dateien, Beispiel-Vorlagen mit .example-Suffix).
#
# ACHTUNG, Produkt-Repo: Diese Listen gelten fuer das Template. In einem daraus
# erzeugten Repo muessen sie umgestellt werden — README.md, LICENSE und
# CHANGELOG.md sind dort Dateien des Moebels und gehoeren in den
# CERN-OHL-S-2.0-Block; die .example-Pfade, changelog.md und MIGRATIONS.md
# fallen weg, weil Phase 2 sie umbenennt oder loescht. Anleitung in
# instructions/reference/workflow-phases.md, Phase 2, Schritt 9.
# Gegenprobe: jede versionierte Datei von genau einem Block erfasst, keine von
# beiden.

# --- MIT: Template selbst ---
[[annotations]]
path = [
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "MIGRATIONS.md",
  "REUSE.toml",
  "heimeliq.schema.json",
  ".github/workflows/**",
  ".gitignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "FIXME-Jahr FIXME Vorname Nachname <FIXME@heimeliq.de>"
SPDX-License-Identifier = "MIT"

# --- CERN-OHL-S-2.0: Inhalte, die zum Moebel-Repo werden ---
[[annotations]]
path = [
  "README.example.md",
  "LICENSE.example",
  "okh.toml",
  "heimeliq.toml",
  "changelog.md",
  "docs/**",
  "cad/**",
  "media/**",
  "**/.gitkeep",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "FIXME-Jahr FIXME Vorname Nachname <FIXME@heimeliq.de>"
SPDX-License-Identifier = "CERN-OHL-S-2.0"
