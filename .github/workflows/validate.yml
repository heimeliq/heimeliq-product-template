name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          pip install --upgrade pip
          pip install tomli jsonschema requests

      - name: Determine repo kind (template vs. product)
        id: kind
        run: |
          # Wenn LICENSE.example UND README.example.md noch existieren, ist dies das
          # Template-Repo selbst. Wenn beide fehlen und stattdessen LICENSE/README.md
          # die Produkt-Variante sind, ist es ein Produkt-Repo.
          if [ -f "LICENSE.example" ] && [ -f "README.example.md" ]; then
            echo "kind=template" >> $GITHUB_OUTPUT
            echo "Erkannt als Template-Repo."
          else
            echo "kind=product" >> $GITHUB_OUTPUT
            echo "Erkannt als Produkt-Repo."
          fi

      # Beide Schema-Checks laufen nur im Produkt-Repo: die Vorlage selbst ist
      # voller FIXME-Platzhalter und Null-Werte und kann per Definition nicht
      # gegen die Schemata validieren.
      - name: Validate okh.toml against OKH schema
        if: steps.kind.outputs.kind == 'product'
        run: |
          python <<'PY'
          import tomli, json, sys, urllib.request, jsonschema
          with open("okh.toml", "rb") as f:
              data = tomli.load(f)
          url = "https://raw.githubusercontent.com/iop-alliance/OpenKnowHow/master/src/schema/okh.schema.json"
          schema = json.loads(urllib.request.urlopen(url).read())
          try:
              jsonschema.validate(data, schema)
              print("okh.toml: OK")
          except jsonschema.ValidationError as e:
              print(f"okh.toml: FAIL\n{e.message}\nPath: {list(e.path)}")
              sys.exit(1)
          PY

      - name: Validate heimeliq.toml against local schema
        if: steps.kind.outputs.kind == 'product'
        run: |
          python <<'PY'
          import tomli, json, sys, jsonschema
          with open("heimeliq.toml", "rb") as f:
              data = tomli.load(f)
          with open("heimeliq.schema.json") as f:
              schema = json.load(f)
          try:
              jsonschema.validate(data, schema)
              print("heimeliq.toml: OK")
          except jsonschema.ValidationError as e:
              print(f"heimeliq.toml: FAIL\n{e.message}\nPath: {list(e.path)}")
              sys.exit(1)
          PY

      # TODO(offener Punkt 0.5.x): type und theme gegen vocabulary/types.toml im
      # Instructions-Repo pruefen (theme muss in der themen-Liste des gewaehlten
      # type stehen). Braucht Lesezugriff auf das Instructions-Repo; bis dahin
      # nicht umgesetzt.

      - name: Validate variants
        run: |
          python <<'PY'
          import tomli, sys
          d = tomli.load(open("heimeliq.toml", "rb"))
          v = d.get("variants", {})
          options = v.get("option", [])
          ids = [o.get("id") for o in options]
          fail = False

          # 1. Options-IDs sind innerhalb des Produkts eindeutig.
          dupes = sorted({i for i in ids if ids.count(i) > 1})
          if dupes:
              print(f"variants: FAIL\nMehrfach vergebene Options-IDs: {dupes}")
              fail = True

          # 2. reference zeigt auf eine existierende Option.
          ref = v.get("reference")
          if ref not in ids:
              print(f"variants: FAIL\nreference={ref!r} ist keine der Options-IDs {ids}")
              fail = True

          # 3. Die Sperre: alle Optionen haben denselben Parameter-Schluesselsatz.
          #    Nur die Werte duerfen sich unterscheiden. Kommt ein Schluessel dazu
          #    oder faellt einer weg, ist es ein eigenes Produkt und keine Variante.
          if options:
              base_id = ids[0]
              base = set(options[0].get("parameter", {}))
              for o in options[1:]:
                  keys = set(o.get("parameter", {}))
                  if keys != base:
                      extra = sorted(keys - base)
                      missing = sorted(base - keys)
                      print(
                          f"variants: FAIL\nOption {o.get('id')!r} hat einen anderen "
                          f"Parameter-Schluesselsatz als {base_id!r}."
                      )
                      if extra:
                          print(f"  zusaetzlich: {extra}")
                      if missing:
                          print(f"  fehlt:       {missing}")
                      print(
                          "  Bei einer Variante duerfen sich nur die Zahlen unterscheiden. "
                          "Ein zusaetzlicher Parameter bedeutet ein eigenes Produkt."
                      )
                      fail = True

          # 4. parts verweist nur auf deklarierte Bauteil-IDs.
          declared = {
              e.get("heimeliq-part-id") for e in d.get("external_parts", [])
          }
          try:
              okh = tomli.load(open("okh.toml", "rb"))
          except FileNotFoundError:
              okh = {}
          declared |= {p.get("heimeliq-part-id") for p in okh.get("part", [])}
          declared.discard(None)
          for o in options:
              unknown = sorted(set(o.get("parts", [])) - declared)
              if unknown:
                  print(
                      f"variants: FAIL\nOption {o.get('id')!r} nennt Bauteile, die weder in "
                      f"okh.toml [[part]] noch in heimeliq.toml [[external_parts]] deklariert "
                      f"sind: {unknown}"
                  )
                  fail = True

          if fail:
              sys.exit(1)
          print(f"variants: OK ({len(options)} Option(en), reference={ref!r})")
          PY

      - name: Produkt-Repo – Example files must be renamed
        if: steps.kind.outputs.kind == 'product'
        run: |
          FAIL=0
          if [ -f "LICENSE.example" ]; then
            echo "LICENSE.example existiert noch – bitte zu LICENSE umbenennen."
            FAIL=1
          fi
          if [ -f "README.example.md" ]; then
            echo "README.example.md existiert noch – bitte zu README.md umbenennen."
            FAIL=1
          fi
          if [ ! -f "LICENSE" ]; then
            echo "LICENSE fehlt – bitte LICENSE.example zu LICENSE umbenennen."
            FAIL=1
          fi
          if [ ! -f "README.md" ]; then
            echo "README.md fehlt – bitte README.example.md zu README.md umbenennen."
            FAIL=1
          fi
          exit $FAIL

      - name: Check for FIXME placeholders (only if published)
        if: steps.kind.outputs.kind == 'product'
        run: |
          PUBLISHED=$(python -c "import tomli; d=tomli.load(open('heimeliq.toml','rb')); print('published' in d.get('tags',{}).get('status',[]))")
          if [ "$PUBLISHED" = "True" ]; then
            if grep -RIn "FIXME" --include="*.md" --include="*.toml" --include="*.json" --include="LICENSE" .; then
              echo "FIXME-Platzhalter gefunden, obwohl tags.status 'published' enthaelt. Bitte ersetzen."
              exit 1
            fi
            echo "Keine FIXME-Platzhalter – OK."
          else
            echo "tags.status ohne 'published', FIXME-Check uebersprungen."
          fi

      - name: Check heimeliq-instruction-version is set (only if published)
        if: steps.kind.outputs.kind == 'product'
        run: |
          PUBLISHED=$(python -c "import tomli; d=tomli.load(open('heimeliq.toml','rb')); print('published' in d.get('tags',{}).get('status',[]))")
          if [ "$PUBLISHED" = "True" ]; then
            IV=$(python -c "import tomli; d=tomli.load(open('heimeliq.toml','rb')); print(d.get('heimeliq-instruction-version',''))")
            if [ -z "$IV" ]; then
              echo "tags.status enthaelt 'published', aber heimeliq-instruction-version ist leer. Wird in Phase 2 vom Bot gesetzt."
              exit 1
            fi
            echo "heimeliq-instruction-version=$IV – OK."
          else
            echo "tags.status ohne 'published', heimeliq-instruction-version-Check uebersprungen."
          fi

      - name: Check required media files (only if published)
        if: steps.kind.outputs.kind == 'product'
        run: |
          PUBLISHED=$(python -c "import tomli; d=tomli.load(open('heimeliq.toml','rb')); print('published' in d.get('tags',{}).get('status',[]))")
          if [ "$PUBLISHED" = "True" ] && [ ! -f "media/hero.jpg" ]; then
            echo "tags.status enthaelt 'published', aber media/hero.jpg fehlt."
            exit 1
          fi
          if [ ! -f "media/hero.jpg" ] && [ ! -f "media/hero.jpg.placeholder" ]; then
            echo "Weder media/hero.jpg noch der Placeholder existiert."
            exit 1
          fi
          echo "Medien-Check OK."
