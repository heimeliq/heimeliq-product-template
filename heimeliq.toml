# heimeliq-Erweiterungen
# Diese Datei ergänzt das OKH-Manifest um heimeliq-spezifische Felder, die
# der allgemeine OKH-Standard nicht abbildet (Typ, Thema, Serien-Zugehörigkeit,
# Baugruppen, externe Drittteile, Varianten, Versionsbezüge etc.).
#
# Gegen heimeliq.schema.json validierbar.
#
# WICHTIG zur TOML-Reihenfolge:
# Alle Top-Level-Felder MÜSSEN vor dem ersten Section-Header stehen.

# ============================================================================
# TOP-LEVEL-FELDER
# ============================================================================

"$schema" = "./heimeliq.schema.json"

# Version dieser Vorlage, auf der das Produkt-Repo basiert.
# Wird bei jedem Template-Upgrade aktualisiert (siehe MIGRATIONS.md).
heimeliq-template-version = "0.6.0"

# Version dieses Produkts (SemVer).
# Erhöhen bei: PATCH = Doku-Fixes, MINOR = neue Optionen, MAJOR = Konstruktionsänderung.
version = "0.1.0"

# Verweis auf den instructions-Stand, mit dem dieses Produkt
# produziert wurde. Wird in Phase 2 vom Bot gesetzt.
heimeliq-instruction-version = ""

# Slug für URLs auf der Website; zugleich der Repo-Name.
# Schema: <series>-<type>[-<zusatz>].
# Das dritte Segment ist optional und frei benannt. Es wird nur gesetzt, wenn
# zwei eigenständige Konstruktionen derselben Serie denselben Typ hätten –
# keine Laufnummer, und im Regelfall bleibt es weg.
slug = "FIXME"             # z. B. "gehriq-sideboard"

# Produkt-Typ. Pflicht. Bildet zusammen mit der Serie die Repo-ID und den Slug.
# Der Wert ist ein Slug aus dem zentralen Vokabular vocabulary/types.toml im
# Instructions-Repo – hier nur referenziert, nicht dupliziert.
type = "FIXME"                         # z. B. "sideboard", "tablett", "werkbank"

# Primäres Thema des Produkts. Pflicht.
# Muss in der themes-Liste des gewählten type stehen (vocabulary/types.toml).
theme = "FIXME"                        # z. B. "kueche", "bad", "wohnen", "buero", "werkstatt"

# ============================================================================
# SECTIONS
# ============================================================================

# --- Serie ---
# Die Serie ist eine Produktlinie aus dem Markenvokabular (gehriq, keiliq,
# workaholiq, uhriq …) und bildet das erste Segment der Repo-ID. Was eine Serie
# bedeutet, entscheidet die Serie selbst: mal eine Bauart (gehriq = Gehrung),
# mal eine Domäne (uhriq). Verbindlich beschrieben ist das in der SERIES.md der
# Serie; die konstruktiven Werte liegen zentral in series/<id>/ im
# Instructions-Repo, nicht in diesem Repo.

[series]
id = "FIXME"                           # lowercase, ASCII, z. B. "gehriq"
label = "FIXME"                        # Anzeigeform mit Großschreibung, z. B. "Gehriq"

# --- Tags ---
# Die Achsen und ihre Werte stehen zentral in vocabulary/tags.toml im
# Instructions-Repo; die Schlüssel hier sind mit den dortigen Achsen-IDs
# identisch. Welche Werte je Achse zulässig sind, ist offen (Slugs, lowercase,
# ASCII). Leere Arrays sind zulässig. Die Achse "status" trägt den
# Veröffentlichungsstatus – der Wert "published" schaltet in validate.yml die
# Vollständigkeits-Checks scharf.
#
# Marken-Vokabular wie massiq/gehriq/keiliq ist bewusst KEINE Achse: es steht
# als Serie im ersten Segment der Repo-ID und ist von dort ableitbar.

[tags]
joint = []                             # Verbindungsart, z. B. "gehrung", "duebel"
species = []                           # Holzart, z. B. "eiche", "esche"
material = []                          # weitere Materialien, z. B. "stahl", "sperrholz"
tooling = []                           # benötigtes Werkzeug, z. B. "oberfraese"
effort = []                            # Aufwand, z. B. "wochenende"
property = []                          # Eigenschaften, z. B. "stapelbar"
status = []                            # "draft" | "published" | "archived"

# ============================================================================
# VARIANTEN
# ============================================================================
# Ein Produkt kann in mehreren Größen und Innenaufteilungen gebaut werden.
# Das sind Varianten. Sie bekommen kein eigenes Repo, sondern sind Daten hier.
#
# Eine PRODUKTVARIANTE ist frei: sie darf sich in Maßen, Innenaufteilung und
# Bauteilauswahl unterscheiden. Ihr Name ist frei gewählt – Maßangabe
# ("1200x800"), Aufteilungsraster ("3x4x3") oder Wort ("klein") sind
# gleichermaßen zulässig. Einzige harte Regel: innerhalb eines Produkts darf
# kein Name zweimal vorkommen (geprüft in validate.yml).
#
# Eine BAUTEILVARIANTE hat keine eigene ID. Dieselbe Bauteil-ID bezeichnet über
# alle Produktvarianten hinweg dieselbe Bauform; nur ihre Zahlen (Maße, Anzahl)
# unterscheiden sich. Die Produktvariante darf frei sein, weil sie Bauteile
# AUSWÄHLT, statt sie zu verändern.
#
# Die Sperre dagegen, dass eine "Variante" in Wahrheit eine andere Konstruktion
# ist: alle Optionen haben denselben Satz von `parameter`-Schlüsseln. Kommt ein
# Schlüssel dazu oder fällt einer weg, ist es ein eigenes Produkt. Nur die
# Werte dürfen sich unterscheiden.
#
# `reference` verweist auf die `id` einer Option und bestimmt, welche Variante
# im Repo ausgerechnet und committet vorliegt (docs/de/build-guide.md,
# docs/de/bom.md) und welche die okh.toml unter `outer-dimensions` beschreibt.
# Nicht implizit die erste Option.
#
# Die Schlüssel in `parameter` sind IDENTISCH mit den Alias-Namen der Zellen
# im FreeCAD-Spreadsheet. Das ist die Kopplung zwischen CAD und Doku: derselbe
# Name adressiert dieselbe Größe in beiden Welten. Hier stehen nur die freien
# EINGANGSWERTE – Bauteilmaße und Stückzahlen leitet der Generator daraus ab
# und werden nicht doppelt gepflegt. Eine Anzahl ist dabei eine Zahl wie jede
# andere: `FaecherMitte = 4` ist ein gültiger Parameter, und damit ändert sich
# die Zahl der Fachböden zwischen Varianten, ohne die Sperre zu verletzen.
#
# `parts` listet die Bauteile, die diese Variante enthält – voll qualifizierte
# IDs aus okh.toml [[part]] und [[external_parts]] weiter unten. Eine Baugruppe
# gilt als enthalten, sobald eines ihrer Bauteile gelistet ist.
#
# Ein Produkt ohne Größenauswahl hat genau eine Option, die zugleich
# `reference` ist (n = 1). Das ist kein Sonderfall und braucht keine eigene
# Syntax.

[variants]
reference = "FIXME"                    # id einer der folgenden Optionen

[[variants.option]]
id = "FIXME"                           # frei gewählt, lowercase, ohne Umlaute; z. B. "klein", "1200x800", "3x4x3"
label = "FIXME"                        # Anzeigeform, z. B. "40 × 30 cm"
parameter = { }                        # Alias-Name = Zahl, z. B. { length = 400, width = 300, FaecherMitte = 3 }
parts = ["A001.S001"]                  # FIXME: alle Bauteil-IDs dieser Variante

# Weitere Optionen bei Bedarf ergänzen. Bei einem Produkt ohne Größenauswahl
# bleibt es bei dieser einen Option, und `reference` zeigt auf ihre `id`.

# ============================================================================
# BAUGRUPPEN
# ============================================================================
# A001 ist konventionell die Hauptbaugruppe = das ganze Produkt.
# Sub-Baugruppen (Schubladen, Türen, Erweiterungen) bekommen A002, A003, ...
# und referenzieren ihre Eltern-Baugruppe über `parent`.
# `optional = true` markiert eine Baugruppe als Erweiterung (= später im Shop
# als optionale Variante mit Aufpreis konfigurierbar).
#
# `bauform` ist optional und benennt eine geteilte parametrische Quelle.
# Baugruppen mit derselben `bauform` sind dasselbe Ding in anderen Größen –
# drei verschieden breite Schubladen sind A002, A003, A004 mit
# `bauform = "schublade"`. Die IDs bleiben damit flach und stabil, und die
# Bauanleitung beschreibt die Schublade einmal.
#
# Jede Baugruppe entspricht einer eigenen FreeCAD-Datei:
#   cad/source/A001-<Name>.FCStd
#   cad/source/A002-<Name>.FCStd
#   ...

# Hauptbaugruppe (= das Produkt selbst). Pflicht.
[[assemblies]]
heimeliq-assembly-id = "A001"
name = "FIXME Produktname (Hauptbaugruppe)"
source = "cad/source/A001-FIXME-name.FCStd"
optional = false

# Beispiel für eine optionale Sub-Baugruppe (z. B. Schublade).
# Kann gelöscht werden, falls das Produkt nur aus der Hauptbaugruppe besteht.
[[assemblies]]
heimeliq-assembly-id = "A002"
name = "FIXME Sub-Baugruppe (z. B. Schublade)"
description = "FIXME kurze Beschreibung der Baugruppe"
bauform = "FIXME"                      # optional, z. B. "schublade"; bei mehreren Größen derselben Bauform überall derselbe Wert
source = "cad/source/A002-FIXME-name.FCStd"
parent = "A001"
optional = true

# ============================================================================
# Externe Bauteile (Standard- und Drittteile, nicht open source)
# ============================================================================
# Schrauben, Beschläge, Scharniere etc. Diese stehen NICHT im OKH-`part`-Array,
# weil sie keine eigene Open-Hardware-Doku haben.
# IDs sind immer voll qualifiziert mit Assembly-Präfix:
#   A001.E001, A001.E002, ...  (externe Teile der Hauptbaugruppe)
#   A002.E001, A002.E002, ...  (externe Teile der Sub-Baugruppe Schublade)

[[external_parts]]
heimeliq-part-id = "A001.E001"
name = "FIXME Bezeichnung"             # z. B. "Senkkopfschraube"
standard = "FIXME"                     # z. B. "DIN 7991", "ISO 10642"
material = "FIXME"                     # z. B. "Edelstahl A2"
dimensions = "FIXME"                   # z. B. "M6x40"
quantity = 0

# Beispiel für ein externes Teil in einer Sub-Baugruppe (z. B. Vollauszug
# in einer Schublade). Bei Bedarf entfernen.
[[external_parts]]
heimeliq-part-id = "A002.E001"
name = "FIXME Bezeichnung in Sub-Baugruppe"
quantity = 0

# ============================================================================
# Empfohlene Holzarten (für Konstruktion bekannt geeignet)
# ============================================================================

[[wood_options]]
species = "FIXME"                      # z. B. "Eberesche"
origin = "regional"
recommended = true

# ============================================================================
# Pflege & Nachhaltigkeit (informativ)
# ============================================================================

[care]
surface_treatment = "FIXME"            # z. B. "Hartwachs-Öl"
recommended_products = []

[sustainability]
wood_source = "FIXME"                  # z. B. "regional, Bayerischer Wald"
co2_documented = false
